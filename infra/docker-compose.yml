name: knowledge-keeper

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: kk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD manquant dans infra/.env}
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
